  <!-- Google Translate Integration -->
  <script type="text/javascript">

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'sl,en,de,it',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
